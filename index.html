<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyMusic</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyMusic">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f151a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { color-scheme: dark; background: #0f151a; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); height: 100%; }
body { margin: 0; font: 14px system-ui, sans-serif; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: one calm reading column; a dated masthead, then Today, This week, Later, and the import panel at the foot. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --ink: #1d2a33;
  --muted: #5b6a74;
  --line: #d5dde2;
  --accent: #1f6f78;
  --accent-soft: #dcecee;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191e; --surface: #1a242b; --ink: #e6edf1; --muted: #9aaab4; --line: #2b3943;
    --accent: #6cc3cb; --accent-soft: #1d3a3e; --warn: #f0b860; --warn-soft: #3a2c14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12191e; --surface: #1a242b; --ink: #e6edf1; --muted: #9aaab4; --line: #2b3943;
  --accent: #6cc3cb; --accent-soft: #1d3a3e; --warn: #f0b860; --warn-soft: #3a2c14; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 7vw, 42px); line-height: 1.1; margin: 0; text-wrap: balance; }
.summary { color: var(--muted); margin: 6px 0 0; }
.stale { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 15px; margin-top: 10px; }
section { display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--display); font-weight: 500; font-size: 24px; margin: 0; display: flex; align-items: baseline; gap: 10px; }
h2 .count { font-family: var(--body); font-size: 14px; color: var(--muted); font-weight: 400; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ev { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.ev:last-child { border-bottom: 1px solid var(--line); }
.when { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; display: flex; flex-direction: column; gap: 2px; }
.when strong { color: var(--ink); font-size: 17px; }
.what { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.what .title { font-weight: 700; overflow-wrap: anywhere; }
.what .meta { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.what .notes { color: var(--muted); font-size: 14px; white-space: pre-line; overflow-wrap: anywhere; }
.pill { align-self: flex-start; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--accent-soft); color: var(--accent); }
.pill.soon { background: var(--warn-soft); color: var(--warn); }
.today-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; }
.today-card .ev:first-child { border-top: 0; }
.today-card .ev:last-child { border-bottom: 0; }
.empty { color: var(--muted); margin: 0; }
.today-card .empty { padding: 16px 0; }
.import { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.import h2 { font-size: 21px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
button, .filebtn {
  font: inherit; font-size: 16px; font-weight: 700; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
}
button.ghost { background: transparent; color: var(--accent); }
button.danger { background: transparent; color: var(--warn); border-color: var(--warn); }
button:focus-visible, .filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; }
.status { font-size: 15px; margin: 0; min-height: 1.4em; }
.status.err { color: var(--warn); }
.cals { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.cals li { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; font-size: 15px; }
.cals li span { min-width: 0; overflow-wrap: anywhere; }
.cals button { font-size: 14px; padding: 4px 12px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 15px; }
.foot { font-size: 13px; color: var(--muted); }
.runline { font-size: 14px; color: var(--muted); margin: 0; }
.runline.old { color: var(--warn); }
.money { display: flex; flex-direction: column; gap: 14px; }
.figs { display: flex; flex-wrap: wrap; gap: 12px 32px; }
.fig { display: flex; flex-direction: column; }
.fig b { font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig span { font-size: 14px; color: var(--muted); }
.bars { display: grid; grid-template-columns: minmax(0, 11em) 1fr auto; gap: 6px 12px; align-items: center; font-size: 15px; }
.bars .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.bars .amt { font-variant-numeric: tabular-nums; text-align: right; }
.sub { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 4px 0 0; }
.mail { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line); }
.mail:last-child { border-bottom: 1px solid var(--line); }
.mail .top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.mail .from { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.mail .subj, .mail .sum { min-width: 0; overflow-wrap: anywhere; }
.mail .sum, .mail .hint { color: var(--muted); font-size: 15px; }
.mail .hint { color: var(--warn); }
.mail.sus { border-left: 4px solid var(--warn); padding-left: 12px; }
.mail button { font-size: 14px; padding: 4px 12px; flex: none; }
.flag { color: var(--warn); }
.player .now { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
.np-title { font-family: var(--display); font-weight: 600; font-size: 21px; color: var(--accent); overflow-wrap: anywhere; }
.np-meta { font-size: 14px; color: var(--muted); }
.seekrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player input[type=range] { width: 100%; accent-color: var(--accent); min-width: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls #bPlay { min-width: 64px; font-size: 18px; }
.controls .ghost[aria-pressed="true"], .pick .ghost[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.vol { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-left: auto; min-width: 0; }
.vol input { width: 110px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pick input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filebtn.ghostbtn { background: transparent; color: var(--accent); }
.playlist { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; border-top: 1px solid var(--line); }
.playlist li { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
.playlist li.cur { background: var(--accent-soft); }
.playlist .name { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.playlist li.cur .name { font-weight: 700; color: var(--accent); }
.playlist .star { font-size: 18px; padding: 0 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.playlist .star.on { color: var(--warn); }
h2 .toggle { font-family: var(--body); font-size: 14px; padding: 3px 12px; margin-left: auto; }
select { font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; max-width: 100%; }
.taskform { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.taskform #taskTitle { grid-column: 1 / -1; }
.taskform input { font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.taskform input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (min-width: 560px) { .taskform { grid-template-columns: 1fr 10em auto; } .taskform #taskNote { grid-column: 1 / 2; grid-row: 2; } .taskform #taskDue { grid-row: 2; } .taskform button { grid-row: 2; } }
.task { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.task:last-child { border-bottom: 1px solid var(--line); }
.task input[type=checkbox] { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.task .what { flex: 1; }
.task .del { font-size: 13px; padding: 2px 10px; flex: none; }
.task.over .title { color: var(--warn); }
.log { display: flex; flex-direction: column; gap: 10px; }
.log summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 6px 0; }
.log summary .count { font-weight: 400; color: var(--muted); font-size: 14px; }
.log summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.log #logSearch { font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box; margin: 6px 0 4px; }
.log #logSearch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.donebar { font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.donebar button { font-size: 14px; padding: 4px 12px; }
.notes-list { margin: 0; padding-left: 20px; font-size: 14px; color: var(--muted); }
@media (max-width: 440px) { .ev { grid-template-columns: 76px 1fr; gap: 10px; } .bars { grid-template-columns: minmax(0, 8em) 1fr auto; } }
@media (prefers-reduced-motion: no-preference) { .drop { transition: background .15s, border-color .15s; } }
</style>
<style>
:root, :root[data-theme] { --bg: #0f151a; --surface: #172028; --ink: #e6edf1; --muted: #9aaab4; --line: #2b3943;
  --accent: #6cc3cb; --accent-soft: #1d3a3e; --warn: #f0b860; --warn-soft: #3a2c14; color-scheme: dark; }
/* Full-screen phone layout: the player fills the screen height; only the song list scrolls. */
html, body { height: 100%; }
body { padding-block: 10px; box-sizing: border-box; overflow: hidden; }
.wrap { height: 100%; gap: 0; }
h1 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; }
.player { flex: 1; min-height: 0; gap: 14px; box-sizing: border-box; }
#musicBody { flex: 1; min-height: 0; }
.player .now { padding: 18px 16px; }
.np-title { font-size: 24px; }
.controls { flex-wrap: nowrap; }
.controls button { flex: 1; font-size: 22px; padding: 14px 0; }
.controls #bShuffle { font-size: 15px; }
.vol { margin-left: 0; }
.vol input { flex: 1; width: auto; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick > * { text-align: center; white-space: nowrap; min-width: 0; box-sizing: border-box; }
.pick .filebtn { grid-column: 1 / -1; }
.pick .ghost { font-size: 15px; padding-inline: 8px; }
.playlist { flex: 1; min-height: 120px; max-height: none; }
.playlist li { padding: 12px 4px; font-size: 16px; }
.lyrics { flex: 1; min-height: 120px; overflow-y: auto; border-top: 1px solid var(--line); padding: 12px 4px 0; font-size: 19px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
.lyrics::after { content: ""; display: block; height: 30vh; }
.lyrsync[hidden] { display: none; }
.lyrics p { margin: 0 0 10px; color: var(--muted); }
.lyrics.plain p, .lyrics p.on { color: var(--ink); }
.lyrics p.on { font-weight: 700; color: var(--accent); }
.lyrics .empty { color: var(--muted); font-size: 16px; }
.lyrsync { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.lyrsync button { font-size: 15px; padding: 8px 6px; }
.lyrsync span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; min-width: 5.5em; }
@media (prefers-reduced-motion: no-preference) { .lyrics p { transition: color .2s; } }
@media (min-width: 700px) { .wrap { max-width: 480px; } }
</style>

<div class="wrap">
  <section class="import player" aria-labelledby="h-music">
    <h1 id="h-music">MyMusic</h1>
    <div id="musicBody" class="money">
      <div class="now">
        <span class="np-title" id="npTitle">No song playing</span>
        <span class="np-meta" id="npMeta">Choose songs from your iCloud Drive or Music folder to start.</span>
      </div>
      <div class="seekrow">
        <span id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in song">
        <span id="tDur">0:00</span>
      </div>
      <div class="controls">
        <button type="button" class="ghost" id="bPrev" aria-label="Previous song">⏮</button>
        <button type="button" id="bPlay" aria-label="Play">▶</button>
        <button type="button" class="ghost" id="bNext" aria-label="Next song">⏭</button>
        <button type="button" class="ghost" id="bShuffle" aria-pressed="false">Shuffle</button>
      </div>
      <label class="vol">Volume <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></label>
      <div class="pick">
        <label class="filebtn" for="songs">Choose songs<input type="file" id="songs" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple></label>
        <button type="button" class="ghost" id="bFavOnly" aria-pressed="false">Favourites only</button>
        <button type="button" class="ghost" id="bLyrics" aria-pressed="false">Lyrics</button>
      </div>
      <p class="runline" id="musicHint">Pick songs from Files or iCloud Drive (tap Select to choose several). Pick them again each visit; your ★ favourites are remembered.</p>
      <ol class="playlist" id="playlist"></ol>
      <div class="lyrics" id="lyrics" hidden aria-live="off"></div>
      <div class="lyrsync" id="lyrSync" hidden>
        <button type="button" class="ghost" id="bLyrEarlier">◀ Lyrics earlier</button>
        <span id="lyrOfs" aria-live="polite">In time</span>
        <button type="button" class="ghost" id="bLyrLater">Lyrics later ▶</button>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
// Files are picked each visit (browsers can't keep them); favourites and settings stay on this device.
let music = { favourites: [], volume: 80, shuffle: false, favOnly: false };
let saveMusic = async () => { try { localStorage.setItem("music", JSON.stringify(music)); } catch (e) {} };
let songs = [], order = [], pos = -1;
const audio = $("audio");
const songName = f => f.name.replace(/\.[^.]+$/, "");
const fmtClock = s => !isFinite(s) ? "0:00" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const isFav = s => music.favourites.includes(s.name);
function buildOrder(keepCurrent) {
  const cur = pos >= 0 ? order[pos] : null;
  let idx = songs.map((_, i) => i).filter(i => !music.favOnly || isFav(songs[i]));
  if (music.shuffle) for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  order = idx;
  pos = keepCurrent && cur != null ? order.indexOf(cur) : -1;
}
function playAt(p) {
  if (!order.length) return;
  pos = (p + order.length) % order.length;
  const s = songs[order[pos]];
  if (audio.dataset.url) URL.revokeObjectURL(audio.dataset.url);
  audio.dataset.url = URL.createObjectURL(s.file);
  audio.src = audio.dataset.url;
  audio.play().catch(() => {});
  renderPlayer(); showLyrics();
}
function renderPlayer() {
  const cur = pos >= 0 ? songs[order[pos]] : null;
  $("npTitle").textContent = cur ? cur.name : "No song playing";
  $("npMeta").textContent = cur ? "Song " + (pos + 1) + " of " + order.length + (music.favOnly ? " favourites" : "") + (isFav(cur) ? " · ★ favourite" : "")
    : songs.length ? songs.length + " songs loaded. Press play or tap a song." : "Choose songs from your iCloud Drive or Music folder to start.";
  $("bPlay").textContent = audio.paused ? "▶" : "❚❚";
  $("bPlay").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
  $("bShuffle").setAttribute("aria-pressed", String(music.shuffle));
  $("bFavOnly").setAttribute("aria-pressed", String(music.favOnly));
  $("bFavOnly").textContent = "★ Favourites (" + music.favourites.length + ")";
  const ol = $("playlist"); ol.replaceChildren();
  if (!songs.length && music.favourites.length) {
    music.favourites.slice().sort().forEach(n => { const li = el("li"); li.append(el("span", "star on", "★"), el("span", "name", n)); ol.append(li); });
    return;
  }
  // Draw the list in one go, but cap it so a very large selection can't freeze the page.
  const frag = document.createDocumentFragment();
  songs.slice(0, 1000).forEach((s, i) => {
    const li = el("li" , order[pos] === i ? "cur" : "");
    const star = el("button", "star" + (isFav(s) ? " on" : ""), isFav(s) ? "★" : "☆"); star.type = "button";
    star.setAttribute("aria-label", (isFav(s) ? "Remove from" : "Add to") + " favourites: " + s.name);
    star.addEventListener("click", () => {
      music.favourites = isFav(s) ? music.favourites.filter(n => n !== s.name) : [...music.favourites, s.name];
      if (music.favOnly) buildOrder(true);
      renderPlayer(); saveMusic().catch(() => {});
    });
    const name = el("span", "name", s.name);
    name.addEventListener("click", () => { if (music.favOnly && !isFav(s)) { music.favOnly = false; buildOrder(false); } playAt(order.indexOf(i)); });
    li.append(star, name); frag.append(li);
  });
  ol.append(frag);
  if (songs.length > 1000) ol.append(el("li", "runline", (songs.length - 1000) + " more songs are loaded and will play, but aren't listed."));
}
function loadSongs(fileList) {
  const files = [...fileList].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|flac|ogg)$/i.test(f.name));
  if (!files.length) { $("musicHint").textContent = "No music files found there. Pick MP3 or other audio files."; return; }
  songs = files.map(f => ({ name: songName(f), file: f })).sort((a, b) => a.name.localeCompare(b.name));
  audio.pause(); pos = -1; buildOrder(false); renderPlayer(); showLyrics();
  const favFound = songs.filter(isFav).length;
  $("musicHint").textContent = songs.length + " songs loaded" + (music.favourites.length ? ", " + favFound + " of your " + music.favourites.length + " favourites among them." : ". Tap ☆ to star a favourite.");
}
$("songs").addEventListener("change", e => { loadSongs(e.target.files); e.target.value = ""; });
$("bPlay").addEventListener("click", () => {
  if (!order.length) { $("songs").click(); return; }
  if (pos < 0) playAt(0); else if (audio.paused) audio.play().catch(() => {}); else audio.pause();
});
$("bNext").addEventListener("click", () => playAt(pos + 1));
$("bPrev").addEventListener("click", () => { if (audio.currentTime > 3) audio.currentTime = 0; else playAt(pos - 1); });
$("bShuffle").addEventListener("click", () => { music.shuffle = !music.shuffle; buildOrder(true); renderPlayer(); saveMusic().catch(() => {}); });
$("bFavOnly").addEventListener("click", () => { music.favOnly = !music.favOnly; buildOrder(true); renderPlayer(); saveMusic().catch(() => {}); });

  $("tCur").textContent = fmtClock(audio.currentTime);

// Lyrics come from the MP3's own ID3 tag: USLT (plain, or with [mm:ss] times) or SYLT (synced).

    times.forEach(m => lines.push({ t: +m[1] * 60 + parseFloat(m[2].replace(":", ".")), text: t }));

async function readLyrics(file) {

      : ver === 4 ? syncsafe(b, i + 4) : ((b[i + 4] << 24) | (b[i + 5] << 16) | (b[i + 6] << 8) | b[i + 7]) >>> 0;

    let f = b.slice(i + hdr, i + hdr + size);
    if (ver === 4 && b[i + 9] & 0x02) f = unsync(f);
    if (ver === 4 && b[i + 9] & 0x01) f = f.slice(4);

      let p = strEnd(f, 6, enc) + (enc === 1 || enc === 2 ? 2 : 1); const lines = [];
      while (p < f.length) {
        const e = strEnd(f, p, enc), text = decodeText(f.slice(p, e), enc).replace(/^\n/, "");

// Fallback: look the song up on LRCLIB (free, no key) by a cleaned-up file name. Found lyrics are kept on this device.
const NOISE = /official|music\s*video|lyrics?|lyric\s*video|\bmv\b|\bm\/v\b|audio|\bhd\b|\bhq\b|4k|1080p|720p|kbps|karaoke|ktv|visuali[sz]er|官方|歌词|歌詞|动态|動態|完整版|高音质|高音質|高清|字幕|无损|無損|伴奏|純音樂|纯音乐/i;
function cleanName(n) {
  let t = n.replace(/[\(\[（【《「『<][^\)\]）】》」』>]*[\)\]）】》」』>]/g, m => NOISE.test(m) ? " " : " " + m.slice(1, -1) + " ");
  t = t.replace(/\b(official\s+(music\s+)?video|official\s+mv|lyric\s+video|with\s+lyrics|lyrics|audio|mv)\b/gi, " ");
  t = t.replace(/(动态|動態)?(歌词|歌詞)(版)?|官方(完整)?(版)?|完整版|高音质|高音質|高清|无损|無損/g, " ");
  return t.replace(/[_|｜]+/g, " ").replace(/\s*[-–—]\s*/g, " ").replace(/\s+/g, " ").trim();

async function lrclib(q) {
  const r = await fetch("https://lrclib.net/api/search?q=" + encodeURIComponent(q));
  if (!r.ok) throw new Error("lrclib " + r.status);
  return r.json();
}
async function onlineLyrics(s) {
  const key = "lyr:" + s.name;
  try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c) return c; } catch (e) {}
  const q1 = cleanName(s.name), q2 = s.name.replace(/[\(\[（【《「『<][^\)\]）】》」』>]*[\)\]）】》」』>]/g, " ").replace(/[-–—_|]+/g, " ").replace(/\s+/g, " ").trim();
  let res = q1 ? await lrclib(q1) : [];
  if (!res.length && q2 && q2 !== q1) res = await lrclib(q2);
  const q3 = (q1.match(/[\u3400-\u9fff\uf900-\ufaff]+/g) || []).join(" "); // Chinese words only, for mixed titles
  if (!res.length && q3 && q3 !== q1) res = await lrclib(q3);
  res = res.filter(x => !x.instrumental && (x.syncedLyrics || x.plainLyrics));
  if (!res.length) return null;
  const d = audio.duration, near = x => isFinite(d) && x.duration && Math.abs(x.duration - d) < 12;
  const best = res.find(x => near(x) && x.syncedLyrics) || res.find(near) || res.find(x => x.syncedLyrics) || res[0];
  const lrc = best.syncedLyrics && parseLrc(best.syncedLyrics);
  const out = { synced: !!lrc, lines: lrc || best.plainLyrics.split(/\r?\n/).map(text => ({ text })), source: best.artistName + " – " + best.trackName };
  try { localStorage.setItem(key, JSON.stringify(out)); } catch (e) {}
  return out;
}
let lyricLine = -1;
// Per-song timing shift in seconds: positive shows each line later (for lyrics that run ahead of the song).
const ofsKey = s => "lyrofs:" + s.name;
function getOfs(s) { try { return +localStorage.getItem(ofsKey(s)) || 0; } catch (e) { return 0; } }
function showOfs(s) {
  const o = getOfs(s);
  $("lyrOfs").textContent = !o ? "In time" : (o > 0 ? "+" : "−") + Math.abs(o).toFixed(1) + " s";
}
function shiftLyrics(d) {
  const cur = pos >= 0 ? songs[order[pos]] : null; if (!cur) return;
  const o = Math.round((getOfs(cur) + d) * 10) / 10;
  try { if (o) localStorage.setItem(ofsKey(cur), String(o)); else localStorage.removeItem(ofsKey(cur)); } catch (e) {}
  showOfs(cur); lyricLine = -2; syncLyrics();
}
$("bLyrEarlier").addEventListener("click", () => shiftLyrics(-0.5));
$("bLyrLater").addEventListener("click", () => shiftLyrics(0.5));
async function showLyrics() {
  const box = $("lyrics"), on = !!music.showLyrics;
  $("bLyrics").setAttribute("aria-pressed", String(on));
  box.hidden = !on; $("playlist").hidden = on; $("lyrSync").hidden = true;
  if (!on) return;
  const cur = pos >= 0 ? songs[order[pos]] : null;
  lyricLine = -1;
  if (!cur) { box.replaceChildren(el("p", "empty", "Play a song to see its lyrics.")); return; }
  if (cur.lyrics === undefined) {
    box.replaceChildren(el("p", "empty", "Looking for lyrics…"));
    try { cur.lyrics = await readLyrics(cur.file); } catch (e) { cur.lyrics = null; }
    if (!cur.lyrics) {
      box.replaceChildren(el("p", "empty", "Searching online for lyrics…"));
      try { cur.lyrics = await onlineLyrics(cur); } catch (e) { cur.lyrics = undefined; }
    }
    if (cur !== (pos >= 0 ? songs[order[pos]] : null) || !music.showLyrics) return; // song changed meanwhile
  }
  if (cur.lyrics === undefined) { box.replaceChildren(el("p", "empty", "Couldn't reach the lyrics site. Check your internet, then tap Lyrics again.")); return; }
  if (!cur.lyrics) { box.replaceChildren(el("p", "empty", "No lyrics found for this song. Lyrics are found more often when the file name has the song title and singer.")); return; }
  box.className = "lyrics" + (cur.lyrics.synced ? "" : " plain");
  box.replaceChildren(...cur.lyrics.lines.map(l => el("p", "", l.text || " ")));
  if (cur.lyrics.source) box.append(el("p", "empty", "Lyrics found online: " + cur.lyrics.source + ". If this is the wrong song, rename the file to include the title and singer."));
  $("lyrSync").hidden = !cur.lyrics.synced; showOfs(cur);
  box.scrollTop = 0; syncLyrics();
}
function syncLyrics() {
  const cur = pos >= 0 ? songs[order[pos]] : null, box = $("lyrics");
  if (!music.showLyrics || !cur || !cur.lyrics || !cur.lyrics.synced) return;
  const ofs = getOfs(cur);
  let n = -1; cur.lyrics.lines.forEach((l, k) => { if (l.t <= audio.currentTime - ofs + 0.2) n = k; });
  if (n === lyricLine) return;
  const ps = box.children;
  for (const q of box.querySelectorAll("p.on")) q.classList.remove("on");
  lyricLine = n;
  if (ps[n]) { ps[n].classList.add("on"); box.scrollTo({ top: ps[n].offsetTop - box.offsetTop - box.clientHeight / 3, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
}
$("bLyrics").addEventListener("click", () => { music.showLyrics = !music.showLyrics; showLyrics(); saveMusic().catch(() => {}); });
audio.addEventListener("timeupdate", syncLyrics);
audio.addEventListener("seeked", syncLyrics);
function applyMusicSettings() { $("vol").value = music.volume; audio.volume = music.volume / 100; renderPlayer(); showLyrics(); }
try { const m = JSON.parse(localStorage.getItem("music") || "null"); if (m) music = Object.assign(music, m); } catch (e) {}
applyMusicSettings();
</script>
